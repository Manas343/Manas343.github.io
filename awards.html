<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awards & Honors | Manas Goel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-white: #ffffff; 
            --text-dark: #111827; 
            --text-gray: #4b5563; 
            --border-light: #e5e7eb;
            --accent-color: #4f46e5; /* Indigo Blue */
            --accent-light: #e0e7ff;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-white); color: var(--text-dark); line-height: 1.6; }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
        
        /* Navigation */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 25px 0; border-bottom: 1px solid var(--border-light); margin-bottom: 40px; }
        .nav-logo { font-weight: 700; font-size: 1.2rem; color: var(--text-dark); text-decoration: none; letter-spacing: -0.5px; }
        .nav-logo span { color: var(--accent-color); }
        .nav-links a { margin-left: 20px; text-decoration: none; color: var(--text-gray); font-size: 0.95rem; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover { color: var(--accent-color); }
        .nav-links a.active { color: var(--accent-color); border-bottom: 2px solid var(--accent-color); padding-bottom: 4px; }
        
        /* Dotted Page Header */
        .page-header {
            padding: 50px; border-radius: 24px; background-color: #fafafc;
            background-image: radial-gradient(var(--border-light) 2px, transparent 2px);
            background-size: 25px 25px; box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-light); margin-bottom: 50px; text-align: center;
        }
        .page-header h1 { font-size: 2.5rem; margin-bottom: 10px; font-weight: 700; letter-spacing: -1px; }
        
        /* Section Headings */
        section { margin-bottom: 60px; }
        h2.section-title {
            font-size: 1.5rem; margin-bottom: 20px; color: var(--text-dark);
            display: inline-block; border-bottom: 3px solid var(--accent-color); padding-bottom: 8px;
        }

        /* List Items */
        .list-item {
            padding: 20px 0; border-bottom: 1px solid var(--border-light);
            display: flex; justify-content: space-between; align-items: flex-start;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item-left { width: 100%; }
        .list-item-left h4 { font-size: 1.15rem; margin-bottom: 5px; color: var(--text-dark); }
        .list-item-left p { color: var(--text-gray); font-size: 0.95rem; }
        .list-year { 
            font-weight: 700; font-size: 1rem; color: var(--accent-color); 
            background: var(--accent-light); padding: 4px 12px; border-radius: 4px;
            white-space: nowrap; margin-left: 20px;
        }

        /* Image Gallery & Thumbnails */
        .gallery-grid {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .gallery-thumb {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid var(--border-light);
            transition: transform 0.2s, border-color 0.2s;
        }
        .gallery-thumb:hover {
            transform: scale(1.05);
            border-color: var(--accent-color);
        }

        /* Modal (Lightbox) Background */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(0, 0, 0, 0.85); 
            justify-content: center; 
            align-items: center;
        }
        .modal-content {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            animation: zoomIn 0.3s ease;
        }
        @keyframes zoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
